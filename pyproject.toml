[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="kulatej-aura"
version="0.1.0"
description="AURA Guard — policy and audit infrastructure for AI agents"
readme="README.md"
requires-python=">=3.11"
dependencies=["fastapi>=0.110,<1.0","uvicorn[standard]>=0.27,<1.0","pydantic>=2.6,<3.0","httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev=["pytest>=8.0","httpx>=0.27","ruff>=0.3"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=100

[tool.setuptools.packages.find]
include = ["app*"]
